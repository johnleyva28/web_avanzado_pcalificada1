<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oferta de Cursos — TECSUP</title>

  <!-- Bootstrap 5.3 (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navbar superior -->
  <nav class="navbar navbar-dark navbar-custom shadow-sm">
    <div class="container-fluid container">
      <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
        <i class="bi bi-mortarboard-fill"></i>
        <span>Oferta Académica — TECSUP</span>
      </span>
      <span class="navbar-text text-white-50 small d-none d-md-block">
        Catálogo cargado dinámicamente desde
        <code class="text-white-50">GET /api/cursos</code>
      </span>
    </div>
  </nav>

  <!-- Toolbar: filtro + toggle de vista -->
  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="h3 mb-1 fw-bold">Cursos disponibles</h1>
        <p class="text-secondary mb-0" id="summary">Cargando…</p>
      </div>

      <div class="d-flex align-items-center gap-2">
        <!-- Filtro por estado -->
        <div class="btn-group" role="group" aria-label="Filtro de estado">
          <button type="button" class="btn btn-outline-secondary btn-sm active" data-filter="all">
            Todos
          </button>
          <button type="button" class="btn btn-outline-success btn-sm" data-filter="Activo">
            Activos
          </button>
          <button type="button" class="btn btn-outline-danger btn-sm" data-filter="Inactivo">
            Inactivos
          </button>
        </div>

        <!-- Toggle de vista -->
        <div class="btn-group" role="group" aria-label="Cambiar vista">
          <button
            type="button"
            class="btn btn-outline-primary btn-sm active"
            data-view="cards"
            title="Vista en tarjetas"
          >
            <i class="bi bi-grid-3x3-gap-fill"></i>
          </button>
          <button
            type="button"
            class="btn btn-outline-primary btn-sm"
            data-view="list"
            title="Vista en lista"
          >
            <i class="bi bi-list-ul"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Contenedor dinámico -->
    <div id="cursos-container" class="view-cards" aria-live="polite"></div>

    <!-- Estados de carga / error -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3 text-secondary mb-0">Cargando cursos…</p>
    </div>

    <div
      id="error"
      class="alert alert-danger d-none"
      role="alert"
    ></div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-secondary small py-4 mt-5 border-top">
    <div class="container">
      <span class="me-2">API REST con Node.js + Express.</span>
      <span>Datos servidos por <code>GET /api/cursos</code>.</span>
    </div>
  </footer>

  <!-- Bootstrap JS bundle (con Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="app.js"></script>
</body>
</html>
