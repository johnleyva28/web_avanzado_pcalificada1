<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitcoin News Hub - Últimas Noticias</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-content">
      <div class="logo">
        <i class="fab fa-bitcoin"></i>
        <span>Bitcoin News Hub</span>
      </div>
      
      <div class="controls">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Buscar noticias...">
        </div>
        
        <select class="filter-select" id="dateFilter">
          <option value="all">Todas las fechas</option>
          <option value="today">Hoy</option>
          <option value="week">Esta semana</option>
          <option value="month">Este mes</option>
        </select>
        
        <div class="stats">
          <span>Total:</span>
          <span class="stats-badge" id="newsCount">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Widget de Precios de Criptomonedas - Debajo del navbar -->
  <div class="crypto-widget-container">
    <div class="crypto-widget-wrapper">
      <iframe src="https://coinlib.io/widget?type=horizontal_v2&theme=dark&pref_coin_id=1505&invert_hover=" 
              width="100%" 
              height="42" 
              scrolling="auto" 
              marginwidth="0" 
              marginheight="0" 
              frameborder="0" 
              border="0" 
              style="border:0;margin:0;padding:0;">
      </iframe>
    </div>
    <div class="crypto-widget-footer">
      <a href="https://coinlib.io" target="_blank" rel="noopener">Cryptocurrency Prices</a> by Coinlib
    </div>
  </div>

  <main class="container">
    <h1 class="section-title">
      <i class="fas fa-newspaper"></i>
      Últimas Noticias sobre Bitcoin
    </h1>
    <p class="section-subtitle">Mantente informado con las noticias más recientes del mundo cripto</p>
    
    <div id="noticias" class="grid"></div>
  </main>

  <!-- Modal de Detalle -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-detail">
      <button class="modal-close" id="closeModal">
        <i class="fas fa-times"></i>
      </button>
      
      <div class="modal-image-container">
        <img src="" alt="" class="modal-detail-image" id="modalImage">
        <div class="modal-image-overlay">
          <span class="modal-source" id="modalSource"></span>
        </div>
      </div>
      
      <div class="modal-content-detail">
        <h2 class="modal-detail-title" id="modalTitle"></h2>
        
        <div class="modal-meta-info">
          <div class="meta-item">
            <i class="fas fa-calendar-alt"></i>
            <span id="modalDate"></span>
          </div>
          <div class="meta-item">
            <i class="fas fa-clock"></i>
            <span id="modalTime"></span>
          </div>
          <div class="meta-item">
            <i class="fas fa-user"></i>
            <span id="modalAuthor"></span>
          </div>
        </div>
        
        <div class="modal-description" id="modalDescription"></div>
        
        <div class="modal-actions">
          <a href="#" target="_blank" rel="noopener" class="btn-read-full" id="modalLink">
            <i class="fas fa-external-link-alt"></i>
            Leer artículo completo
          </a>
          <button class="btn-share" onclick="shareNews()">
            <i class="fas fa-share-alt"></i>
            Compartir
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const IMG_DEFAULT = 'https://images.unsplash.com/photo-1518546305927-5a555bb7020d?w=800&h=400&fit=crop';
    let allNews = [];
    let filteredNews = [];

    document.addEventListener('DOMContentLoaded', () => {
      cargarNoticias();
      setupEventListeners();
    });

    async function cargarNoticias() {
      const contenedor = document.getElementById('noticias');
      contenedor.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando noticias...</p></div>';
      
      try {
        const res = await fetch('/api/noticias');
        const articulos = await res.json();

        if (!articulos || articulos.length === 0) {
          contenedor.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-inbox"></i>
              <h3>No se encontraron noticias</h3>
              <p>Intenta más tarde o verifica tu conexión</p>
            </div>`;
          actualizarContador(0);
          return;
        }

        allNews = articulos;
        filteredNews = articulos;
        
        renderizarNoticias(articulos);
        actualizarContador(articulos.length);
        
      } catch (err) {
        console.error('Error:', err);
        contenedor.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error al cargar</h3>
            <p>No se pudieron cargar las noticias. Inténtalo más tarde.</p>
          </div>`;
        actualizarContador(0);
      }
    }

    function renderizarNoticias(articulos) {
      const contenedor = document.getElementById('noticias');
      contenedor.innerHTML = '';
      
      if (articulos.length === 0) {
        contenedor.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search"></i>
            <h3>Sin resultados</h3>
            <p>No hay noticias que coincidan con tu búsqueda</p>
          </div>`;
        return;
      }

      articulos.forEach((a, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${index * 0.05}s`;
        
        const fecha = a.publishedAt
          ? new Date(a.publishedAt).toLocaleDateString('es-PE', { 
              day: '2-digit', 
              month: 'short', 
              year: 'numeric' 
            })
          : 'Sin fecha';
        
        const hora = a.publishedAt
          ? new Date(a.publishedAt).toLocaleTimeString('es-PE', { 
              hour: '2-digit', 
              minute: '2-digit' 
            })
          : '';
        
        const fuente = a.source && a.source.name ? a.source.name : 'Fuente desconocida';
        const author = a.author || 'Redacción';
        const excerpt = a.description || '';

        card.innerHTML = `
          <div class="card-image">
            <img src="${a.urlToImage || IMG_DEFAULT}" 
                 alt="${a.title || 'Noticia'}" 
                 onerror="this.onerror=null;this.src='${IMG_DEFAULT}'">
            <span class="card-badge">${fuente}</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${a.title || 'Sin título'}</h3>
            <p class="card-excerpt">${excerpt ? excerpt.substring(0, 120) + (excerpt.length > 120 ? '...' : '') : 'Sin descripción disponible'}</p>
            
            <div class="card-meta">
              <div class="card-source">
                <i class="fas fa-building"></i>
                <span>${fuente}</span>
              </div>
              <div class="card-date">
                <i class="fas fa-calendar"></i>
                <span>${fecha}</span>
              </div>
            </div>
            
            <div class="card-actions">
              <button class="btn btn-secondary" onclick="verDetalle(${index})">
                <i class="fas fa-eye"></i>
                Ver detalle
              </button>
              <a href="${a.url}" target="_blank" rel="noopener" class="btn btn-primary">
                <i class="fas fa-external-link-alt"></i>
                Leer más
              </a>
            </div>
          </div>
        `;
        
        contenedor.appendChild(card);
      });
    }

    function verDetalle(index) {
      const noticia = filteredNews[index];
      if (!noticia) return;

      const fecha = noticia.publishedAt
        ? new Date(noticia.publishedAt).toLocaleDateString('es-PE', { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          })
        : 'Sin fecha';
      
      const hora = noticia.publishedAt
        ? new Date(noticia.publishedAt).toLocaleTimeString('es-PE', { 
            hour: '2-digit', 
            minute: '2-digit' 
          })
        : '';
      
      const author = noticia.author || 'Redacción';
      const fuente = noticia.source && noticia.source.name ? noticia.source.name : 'Fuente desconocida';

      document.getElementById('modalImage').src = noticia.urlToImage || IMG_DEFAULT;
      document.getElementById('modalImage').onerror = function() { this.src = IMG_DEFAULT; };
      document.getElementById('modalSource').textContent = fuente;
      document.getElementById('modalTitle').textContent = noticia.title || 'Sin título';
      document.getElementById('modalDate').textContent = fecha;
      document.getElementById('modalTime').textContent = hora;
      document.getElementById('modalAuthor').textContent = author;
      document.getElementById('modalDescription').innerHTML = `
        <p>${noticia.description || 'Descripción no disponible. Haz clic en "Leer artículo completo" para ver la noticia en la fuente original.'}</p>
        ${noticia.content ? `<p>${noticia.content.substring(0, 500)}...</p>` : ''}
      `;
      document.getElementById('modalLink').href = noticia.url || '#';
      
      document.getElementById('detailModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function setupEventListeners() {
      document.getElementById('searchInput').addEventListener('input', (e) => {
        filtrarNoticias(e.target.value.toLowerCase(), document.getElementById('dateFilter').value);
      });

      document.getElementById('dateFilter').addEventListener('change', (e) => {
        filtrarNoticias(document.getElementById('searchInput').value.toLowerCase(), e.target.value);
      });

      document.getElementById('closeModal').addEventListener('click', cerrarModal);
      
      document.getElementById('detailModal').addEventListener('click', (e) => {
        if (e.target.id === 'detailModal') cerrarModal();
      });
      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') cerrarModal();
      });
    }

    function filtrarNoticias(termino, filtroFecha) {
      let filtradas = [...allNews];
      
      if (termino && termino.trim() !== '') {
        filtradas = filtradas.filter(n => 
          (n.title && n.title.toLowerCase().includes(termino)) ||
          (n.description && n.description.toLowerCase().includes(termino)) ||
          (n.source && n.source.name && n.source.name.toLowerCase().includes(termino)) ||
          (n.author && n.author.toLowerCase().includes(termino))
        );
      }
      
      if (filtroFecha !== 'all') {
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        
        filtradas = filtradas.filter(n => {
          if (!n.publishedAt) return false;
          const fechaNoticia = new Date(n.publishedAt);
          const diffDias = Math.floor((hoy - fechaNoticia) / (1000 * 60 * 60 * 24));
          
          if (filtroFecha === 'today') return diffDias === 0;
          if (filtroFecha === 'week') return diffDias <= 7;
          if (filtroFecha === 'month') return diffDias <= 30;
          return true;
        });
      }
      
      filteredNews = filtradas;
      renderizarNoticias(filtradas);
      actualizarContador(filtradas.length);
    }

    function actualizarContador(cantidad) {
      document.getElementById('newsCount').textContent = cantidad;
    }

    function cerrarModal() {
      document.getElementById('detailModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function shareNews() {
      const title = document.getElementById('modalTitle').textContent;
      const url = document.getElementById('modalLink').href;
      
      if (navigator.share) {
        navigator.share({
          title: title,
          url: url
        }).catch(err => console.log('Error al compartir:', err));
      } else {
        navigator.clipboard.writeText(url).then(() => {
          alert('Enlace copiado al portapapeles');
        }).catch(err => {
          console.error('Error:', err);
        });
      }
    }

    window.verDetalle = verDetalle;
    window.shareNews = shareNews;

    // Animación del widget al hacer scroll
window.addEventListener('scroll', () => {
  const widget = document.querySelector('.crypto-widget-container');
  if (window.scrollY > 100) {
    widget.classList.add('scrolled');
  } else {
    widget.classList.remove('scrolled');
  }
});
  </script>

</body>
</html>
